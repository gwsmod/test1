<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTP Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f3f8;font-family:Arial,sans-serif;padding:20px}
.card{width:100%;max-width:460px;background:#fff;border-radius:22px;padding:30px;box-shadow:0 15px 40px #0002}
h2{text-align:center;color:#172033;margin:0 0 8px}.sub{text-align:center;color:#64748b;font-size:14px;margin-bottom:20px}
label{display:block;font-size:14px;font-weight:bold;margin:14px 0 7px}
input,button{width:100%;height:52px;border-radius:12px;font-size:16px}
input{border:1px solid #cbd5e1;padding:0 14px;outline:none}input:focus{border-color:#2563eb}
button{border:0;background:#2563eb;color:white;font-weight:bold;margin-top:16px;cursor:pointer}button:disabled{opacity:.6}
.hidden{display:none}.status{margin-top:18px;padding:13px;border-radius:12px;background:#eff6ff;color:#1e40af;font-size:14px;word-break:break-word}
.error{background:#fef2f2;color:#991b1b}.success{background:#f0fdf4;color:#166534}
</style>
</head>
<body>
<div class="card">
<h2>Phone Login</h2>
<p class="sub">Login with your phone and OTP</p>

<div id="loginStep">
<label>Phone Number</label>
<input id="phone" maxlength="10" inputmode="numeric" placeholder="Enter 10-digit number">
<button id="sendBtn">Send OTP</button>
</div>

<div id="otpStep" class="hidden">
<label>OTP</label>
<input id="otp" maxlength="6" inputmode="numeric" placeholder="Enter OTP">
<button id="verifyBtn">Verify & Login</button>
</div>

<!-- Password is entered only after successful login. It is not saved in localStorage. -->
<div id="passwordStep" class="hidden">
<label>Set Password</label>
<input id="password" type="password" autocomplete="new-password" placeholder="Enter your password">
<label>Confirm Password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password">
<button id="savePasswordBtn">Save Password</button>
</div>

<div id="status" class="status">Enter your phone number.</div>
</div>

<script>
const API = {
  otpLogin: "/api/user/otplogin",
  verifyOtp: "/api/user/verifyotp",
  // Configure this only on an authorized same-origin backend:
  savePassword: "/api/user/savepassword"
};

let verificationToken = "";
let accessToken = "";
const deviceId = localStorage.getItem("otp_device_id") ||
  (crypto.randomUUID ? crypto.randomUUID().replaceAll("-","") : String(Date.now()));
localStorage.setItem("otp_device_id", deviceId);

const $=id=>document.getElementById(id);
function status(msg,type=""){const e=$("status");e.textContent=msg;e.className="status "+type}
async function json(res){const t=await res.text();try{return JSON.parse(t)}catch{return {message:t}}}

async function sendOtp(){
  const phoneNumber=$("phone").value.replace(/\D/g,"");
  if(!/^\d{10}$/.test(phoneNumber)) return status("Enter a valid 10-digit number.","error");
  $("sendBtn").disabled=true;status("Sending OTP...");
  try{
    const res=await fetch(API.otpLogin,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json","Clientid":"1"},body:JSON.stringify({phoneNumber})});
    const data=await json(res);
    if(!res.ok||!data?.data?.verificationToken) throw Error(data?.message||"OTP request failed");
    verificationToken=data.data.verificationToken;
    $("loginStep").classList.add("hidden");$("otpStep").classList.remove("hidden");
    status("OTP sent successfully. Check your phone.","success");
  }catch(e){status("Request failed: "+e.message,"error")}
  finally{$("sendBtn").disabled=false}
}

async function verifyOtp(){
  const otpCode=$("otp").value.replace(/\D/g,"");
  if(!otpCode) return status("Enter the OTP.","error");
  $("verifyBtn").disabled=true;status("Verifying...");
  try{
    const res=await fetch(API.verifyOtp,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json","Clientid":"1"},body:JSON.stringify({deviceId,otpCode,referralCode:"",verificationToken})});
    const data=await json(res);
    if(!res.ok||!data?.data?.accessToken) throw Error(data?.message||"OTP verification failed");
    accessToken=data.data.accessToken;
    $("otpStep").classList.add("hidden");$("passwordStep").classList.remove("hidden");
    status("Login successful. You can now set a password.","success");
  }catch(e){status("Verification failed: "+e.message,"error")}
  finally{$("verifyBtn").disabled=false}
}

async function savePassword(){
  const password=$("password").value;
  const confirm=$("confirmPassword").value;
  if(password.length<8) return status("Use at least 8 characters.","error");
  if(password!==confirm) return status("Passwords do not match.","error");

  $("savePasswordBtn").disabled=true;status("Saving password...");
  try{
    // Password is sent directly to your authorized backend over HTTPS.
    // It is deliberately NOT stored in localStorage or hard-coded into this HTML.
    const res=await fetch(API.savePassword,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json","Authorization":"Bearer "+accessToken},
      body:JSON.stringify({password})
    });
    const data=await json(res);
    if(!res.ok) throw Error(data?.message||"Password could not be saved");
    $("password").value="";$("confirmPassword").value="";
    status("Password saved successfully.","success");
  }catch(e){
    status("Password save failed: "+e.message+" Configure API.savePassword with your authorized backend endpoint.","error");
  }finally{$("savePasswordBtn").disabled=false}
}

$("sendBtn").onclick=sendOtp;
$("verifyBtn").onclick=verifyOtp;
$("savePasswordBtn").onclick=savePassword;
</script>
</body>
</html>
