<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone OTP Login</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px}
.box{max-width:420px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 20px #0002}
h2{text-align:center}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#2563eb;color:#fff;border:none;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}.hidden{display:none}.status{margin-top:15px;padding:12px;border-radius:8px;background:#eef2ff;word-break:break-word}
.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<div class="box">
  <h2>Phone OTP</h2>

  <div id="phoneStep">
    <input id="phone" inputmode="numeric" maxlength="10" placeholder="Enter 10 digit phone number">
    <button id="sendBtn">Send OTP</button>
  </div>

  <div id="otpStep" class="hidden">
    <input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP">
    <button id="verifyBtn">Verify OTP</button>
    <button id="resendBtn" style="background:#64748b">Resend OTP</button>
  </div>

  <div id="status" class="status">Enter your phone number</div>
</div>

<script>
const API_BASE = "https://nebulaservice.xyz";
let verificationToken = "";
let deviceId = localStorage.deviceId || crypto.randomUUID().replaceAll("-","");
localStorage.deviceId = deviceId;

const phone = document.getElementById("phone");
const otp = document.getElementById("otp");
const statusBox = document.getElementById("status");
const phoneStep = document.getElementById("phoneStep");
const otpStep = document.getElementById("otpStep");

function status(msg,type=""){
  statusBox.textContent=msg;
  statusBox.className="status "+type;
}

async function sendOtp(){
  const phoneNumber=phone.value.replace(/\D/g,"");

  if(!/^\d{10}$/.test(phoneNumber)){
    status("Please enter a valid 10-digit phone number","error");
    return;
  }

  document.getElementById("sendBtn").disabled=true;
  status("Sending OTP...");

  try{
    const res=await fetch(API_BASE+"/api/user/otplogin",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json",
        "Clientid":"1"
      },
      body:JSON.stringify({phoneNumber})
    });

    const data=await res.json();

    if(!res.ok || !data.data?.verificationToken){
      throw new Error(data.message || "OTP request failed");
    }

    verificationToken=data.data.verificationToken;
    phoneStep.classList.add("hidden");
    otpStep.classList.remove("hidden");
    otp.focus();
    status("OTP request successful. Check your SMS.","success");

  }catch(err){
    console.error(err);
    status("OTP could not be requested: "+err.message,"error");
  }finally{
    document.getElementById("sendBtn").disabled=false;
  }
}

async function verifyOtp(){
  const otpCode=otp.value.replace(/\D/g,"");

  if(!/^\d{4,6}$/.test(otpCode)){
    status("Enter a valid OTP","error");
    return;
  }

  if(!verificationToken){
    status("Verification token missing. Please resend OTP.","error");
    return;
  }

  document.getElementById("verifyBtn").disabled=true;
  status("Verifying OTP...");

  try{
    const res=await fetch(API_BASE+"/api/user/verifyotp",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json",
        "Clientid":"1"
      },
      body:JSON.stringify({
        deviceId,
        otpCode,
        referralCode:"",
        verificationToken
      })
    });

    const data=await res.json();

    if(!res.ok || data.status!==200){
      throw new Error(data.message || "Verification failed");
    }

    status("OTP verified successfully!","success");
    console.log("API response:",data);

  }catch(err){
    console.error(err);
    status("Verification failed: "+err.message,"error");
  }finally{
    document.getElementById("verifyBtn").disabled=false;
  }
}

document.getElementById("sendBtn").onclick=sendOtp;
document.getElementById("verifyBtn").onclick=verifyOtp;
document.getElementById("resendBtn").onclick=()=>{
  verificationToken="";
  otp.value="";
  phoneStep.classList.remove("hidden");
  otpStep.classList.add("hidden");
  status("Enter your phone number and request a new OTP.");
};
</script>
</body>
</html>
